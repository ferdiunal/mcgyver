name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: snapcore/action-build@v1.3.0
        id: build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

  deb:
    # Built on the oldest target (Ubuntu 24.04) so the glibc requirement stays low.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo install cargo-deb --locked
      # Reads [package.metadata.deb] from Cargo.toml (see PACKAGING.md)
      - run: cargo deb
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: deb
          path: target/debian/*.deb

  rpm:
    runs-on: ubuntu-24.04
    # The oldest Fedora still supported, so the rpm's glibc requirement doesn't float upward.
    container: fedora:43
    steps:
      - name: Build dependencies
        run: dnf install -y git gcc gcc-c++ make cmake clang pkgconf-pkg-config wayland-devel libxkbcommon-devel curl rpm-build
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo install cargo-generate-rpm --locked
      - run: cargo build --release
      # Reads [package.metadata.generate-rpm] from Cargo.toml (see PACKAGING.md)
      - run: cargo generate-rpm
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rpm
          path: target/generate-rpm/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [snap, deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  publish-snap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: snap
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: snap
          path: snap-dist
      # Secrets can't be tested in `if:` directly, so go through an env var.
      - name: Find snap
        id: find
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: echo "file=$(ls snap-dist/*.snap)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1.2.0
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.find.outputs.file }}
          release: edge
